<title>妈妈的ごきげん转盘</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","PingFang SC","Noto Sans CJK JP",sans-serif;color:#594630;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{background:#d8c3a0;overscroll-behavior-y:none}
.page{min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:18px 13px 24px;background:radial-gradient(ellipse 67% 33% at 5% 2%,#fff7e9b2 0,transparent 100%),radial-gradient(ellipse 75% 55% at 99% 99%,#a98b6095 0,transparent 85%),radial-gradient(#c8ac7f44 1px,transparent 1px) 0 0/21px 21px,linear-gradient(135deg,#e4d2b0 0%,#cbb087 52%,#e3cfab 100%)}
.shell{position:relative;overflow:hidden;text-align:center;width:min(100%,540px);margin:auto;padding:26px 17px 26px;border:1.5px solid #bf9e67;border-radius:25px;background:linear-gradient(166deg,#fffcf4 0%,#f6ecd9 66%,#f7edda 100%);box-shadow:0 20px 50px #71562d3d,0 0 0 5px #fff7e43d}
.shell:before,.shell:after{position:absolute;content:'✧';color:#b79459;pointer-events:none;font-size:23px;opacity:.75}
.shell:before{top:130px;left:5%}.shell:after{top:159px;right:5%}
.kicker{display:inline-flex;align-items:center;justify-content:center;border:1px solid #d8be8b;background:#fef8eb;border-radius:100px;padding:8px 17px;color:#947044;font-weight:700;font-size:11px;letter-spacing:.1em}
h1{font-size:clamp(24px,6.2vw,35px);font-weight:850;color:#5b4228;line-height:1.35;letter-spacing:.012em;margin:17px auto 8px;overflow-wrap:anywhere}
.intro{font-size:clamp(12px,3.35vw,14px);color:#93734c;font-weight:600;line-height:1.7;margin:9px 0 19px}.intro b{color:#7b5b35;font-weight:750}
.wheel-area{position:relative;width:min(100%,425px);aspect-ratio:1;margin:2px auto 13px;filter:drop-shadow(0 10px 8px #90714855)}
.wheel{display:block;width:100%;height:100%;transform:rotate(0deg);will-change:transform}
.slice-text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","PingFang SC",sans-serif;pointer-events:none;paint-order:stroke;stroke:#fff8e5a6;stroke-width:1.8px;stroke-linejoin:round}
.pointer{position:absolute;top:-13px;left:50%;transform:translateX(-50%);width:50px;height:67px;z-index:5;pointer-events:none;filter:drop-shadow(0 3px 2px #80643b66)}
.center-spin{appearance:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;border:3px solid #ac8549;background:radial-gradient(circle at 28% 20%,#fffef8,#f2e0b9 83%);border-radius:50%;width:25%;height:25%;min-height:80px;min-width:80px;max-height:114px;max-width:114px;color:#8c6b35;cursor:pointer;box-shadow:0 0 0 5px #fdf4e3d1,0 5px 8px #634c2e40;touch-action:manipulation}
.center-spin .crown{font:normal 34px/1 Georgia,serif}.center-spin .center-word{font-size:14px;font-weight:900;letter-spacing:.12em}
.center-spin:focus-visible,.btn:focus-visible{outline:3px solid #84663d;outline-offset:4px}
.result[hidden]{display:none}
.result{margin:8px auto 15px;padding:4px 8px;max-width:400px}
.result-label{font-size:11px;letter-spacing:.15em;color:#9a7848;font-weight:800;margin:0 0 7px}
.result-name{font-weight:850;font-size:clamp(19px,4.9vw,24px);color:#5f472d;line-height:1.45;margin:0;overflow-wrap:anywhere;animation:appear .46s ease-out}
@keyframes appear{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.btn{display:block;margin:17px auto 0;width:min(94%,370px);padding:14px 9px;min-height:54px;background:linear-gradient(160deg,#bc965b 0%,#9d7844 64%,#846232 100%);border:1.5px solid #765a34;box-shadow:0 4px 0 #755b38;color:#fff9eb;border-radius:13px;cursor:pointer;touch-action:manipulation;font-family:inherit;font-size:clamp(15px,4.15vw,18px);letter-spacing:.03em;font-weight:800;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #755b38}.btn:disabled,.center-spin:disabled{opacity:.7;cursor:wait}
.love-note{display:flex;justify-content:center;align-items:center;gap:15px;font-size:14px;font-weight:700;color:#9a784a;letter-spacing:.085em;margin:24px auto 3px}.love-note:before,.love-note:after{content:'';width:48px;max-width:15%;height:1px;background:#c8ac7d}
.confetti{position:fixed;pointer-events:none;inset:0;z-index:10;overflow:hidden}.petal{position:absolute;top:-25px;width:10px;height:15px;background:var(--paper);border-radius:60% 12% 60% 12%;animation:fall var(--duration) ease-in forwards;animation-delay:var(--delay)}
@keyframes fall{to{transform:translate(var(--drift),104vh) rotate(var(--turn));opacity:0}}
@media(max-width:380px){.shell{padding:22px 11px 24px}.page{padding:11px 8px 19px}.intro{margin-bottom:15px}.pointer{width:44px;height:57px;top:-11px}}
@media(prefers-reduced-motion:reduce){.result-name{animation:none}.petal{animation-duration:.8s}.btn{transition:none}}
</style>

<div class="confetti" id="confetti" aria-hidden="true"></div>
<script>
'use strict';
(()=>{
 const entries=["カルティエ指輪", "エルメスのシルバーネックレス", "時計", "brownベルト", "LV白いcap", "Diorスニーカー", "スカーフ", "モンクレールダウンコート"];
 const wheel=document.getElementById('wheel');
 const spinButton=document.getElementById('spinButton');
 const centerSpin=document.getElementById('centerSpin');
 const result=document.getElementById('result');
 const resultName=document.getElementById('resultName');
 let angle=0,spinning=false;
 const norm=n=>(n%360+360)%360;
 function randomIndex(max){
   if(window.crypto&&window.crypto.getRandomValues){
     const arr=new Uint32Array(1),upper=Math.floor(4294967296/max)*max;
     do{window.crypto.getRandomValues(arr)}while(arr[0]>=upper);
     return arr[0]%max;
   }
   return Math.floor(Math.random()*max);
 }
 function celebrate(){
   const holder=document.getElementById('confetti');
   holder.replaceChildren();
   const palette=['#cfb37e','#ac8755','#f5e8c9','#dec28a','#b49a6d'];
   for(let i=0;i<34;i++){
     const el=document.createElement('i');el.className='petal';
     el.style.setProperty('--paper',palette[i%palette.length]);
     el.style.left=Math.random()*100+'%';
     el.style.setProperty('--duration',(2+Math.random()*1.6)+'s');
     el.style.setProperty('--delay',(Math.random()*.6)+'s');
     el.style.setProperty('--drift',(Math.random()*220-110)+'px');
     el.style.setProperty('--turn',(Math.random()*1100-550)+'deg');
     holder.appendChild(el);
   }
   setTimeout(()=>holder.replaceChildren(),3900);
 }
 function spin(){
   if(spinning)return;
   spinning=true;
   spinButton.disabled=true;
   centerSpin.disabled=true;
   spinButton.textContent='正在转转…';
   result.hidden=true;
   const index=randomIndex(entries.length),step=360/entries.length;
   const jitter=(Math.random()-.5)*step*.36;
   const goal=norm(-index*step+jitter);
   const delta=norm(goal-norm(angle));
   angle=norm(angle);
   wheel.style.transition='none';
   wheel.style.transform=`rotate(${angle}deg)`;
   void wheel.getBoundingClientRect();
   const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
   const duration=reduce?700:4800;
   angle+=360*(reduce?2:7)+delta;
   let finished=false,timer;
   const finish=()=>{
     if(finished)return;
     finished=true;
     clearTimeout(timer);
     spinning=false;
     spinButton.disabled=false;
     centerSpin.disabled=false;
     spinButton.textContent='尊敬的熊掌 请按这里';
     resultName.textContent='🎁 '+entries[index]+' 🎁';
     result.hidden=false;
     try{navigator.vibrate?.(30)}catch(e){}
     celebrate();
   };
   const onEnd=e=>{
     if(e.target===wheel&&e.propertyName==='transform'){
       wheel.removeEventListener('transitionend',onEnd);
       finish();
     }
   };
   wheel.addEventListener('transitionend',onEnd);
   wheel.style.transition=`transform ${duration}ms cubic-bezier(.11,.75,.12,1)`;
   requestAnimationFrame(()=>requestAnimationFrame(()=>{
     wheel.style.transform=`rotate(${angle}deg)`;
   }));
   timer=setTimeout(()=>{wheel.removeEventListener('transitionend',onEnd);finish()},duration+200);
 }
 spinButton.addEventListener('click',spin);
 centerSpin.addEventListener('click',spin);
})();
</script>
